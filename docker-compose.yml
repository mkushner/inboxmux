services:
  inboxmux:
    image: ghcr.io/mkushner/inboxmux:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${INBOXMUX_DOMAIN}
    volumes:
      - inboxmux-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      INBOXMUX_DOMAIN: ${INBOXMUX_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - inboxmux

volumes:
  inboxmux-data:
  caddy-data:
  caddy-config:
